name: Deploy to Hugging Face Spaces

# Publishes the app (Dockerfile + source) to a free Hugging Face Docker Space
# on every push to main. Setup, once:
#   1. Create a Space at https://huggingface.co/new-space (SDK: Docker, Blank).
#   2. Create a write token at https://huggingface.co/settings/tokens.
#   3. In this GitHub repo: Settings -> Secrets and variables -> Actions ->
#        Secrets:   HF_TOKEN = <the token>
#        Variables: HF_SPACE = <your-hf-username>/<space-name>
# Until both are set, this workflow skips itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-huggingface
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret / HF_SPACE variable not set -- skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'

      # Push a single-commit snapshot rather than the full git history, with
      # the Space's metadata README (sdk, port, ...) in place of the project one.
      - name: Push snapshot to the Space
        if: steps.config.outputs.enabled == 'true'
        run: |
          cp deploy/huggingface/README.md README.md
          rm -rf .git
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
