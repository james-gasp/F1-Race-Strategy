[project]
name = "f1-race-strategy"
version = "0.1.0"
description = "F1 race strategy simulation: FastF1-calibrated Monte Carlo strategy and field modeling."
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "api/tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: hits the real FastF1 API; needs network, run explicitly with -m integration",
]

[tool.ruff]
line-length = 100
